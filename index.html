<!-- 歪みフィルタ定義（feTurbulence + feDisplacementMap） -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="gridWarp" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.018" numOctaves="1" seed="4" stitchTiles="stitch" result="n">
        <animate attributeName="baseFrequency" dur="22s" repeatCount="indefinite"
                 values="0.010 0.018;0.016 0.011;0.011 0.020;0.010 0.018"
                 keyTimes="0;0.4;0.7;1"
                 calcMode="spline"
                 keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- 浮遊するくま（Three.js / models/bear.glb） -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("bearScene");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (canvas && !reduce) init();

function init(){
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  } catch (e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 12);

  // 環境マップ（拡散気味にしてハイライトを抑える）
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.5).texture;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb3c8, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(3, 5, 6);
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0xdfe8f2, 0.9);   // 逆光でフチを立てる
  rim.position.set(-4, 2, -5);
  scene.add(rim);

  // くまの見た目：'plush'（ぬいぐるみ）/ 'glass'（すりガラス）/ 'metal'（シルバー）
  function styleBear(root, style){
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const arr = Array.isArray(o.material) ? o.material : [o.material];
      const mats = arr.map((m) => {
        if (!m) return m;
        m = m.clone();                                 // 個体ごとに独立
        const isFace = /顔|face|eye|nose/i.test(m.name || "");
        if (style === "plush"){
          if (m.transmission !== undefined){ m.transmission = 0; m.thickness = 0; }
          m.metalness = 0;
          m.roughness = 0.95;
          m.envMapIntensity = 0.28;
          if (m.sheen !== undefined){
            m.sheen = 1.0;
            m.sheenRoughness = 0.85;
            m.sheenColor = new THREE.Color(0xffffff);
          }
          if (!isFace && m.color && m.color.getHex() >= 0xbfbfbf){
            m.color.setHex(0xe9e0d3);                   // 生成り
          }
        } else if (style === "metal"){
          if (m.transmission !== undefined){ m.transmission = 0; m.thickness = 0; }
          if (m.sheen !== undefined) m.sheen = 0;
          if (m.map) m.map = null;
          if (m.emissive) m.emissive.setHex(0x000000);
          const c = m.color;
          const lum = c ? (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) : 1;
          if (lum < 0.35){
            // 目・鼻など暗いパーツはそのまま残す（黒マット）
            m.metalness = 0;
            m.roughness = 0.55;
            m.envMapIntensity = 0.35;
            if ("clearcoat" in m) m.clearcoat = 0;
            if (c) c.setHex(0x272c33);
          } else {
            // 頭・体などは同じホワイトに統一（マット寄り＋ほんのり艶）
            m.metalness = 0.16;
            m.roughness = 0.32;
            m.envMapIntensity = 1.0;
            if ("clearcoat" in m){ m.clearcoat = 0.4; m.clearcoatRoughness = 0.35; }
            if (c) c.setHex(0xf5f6f7);
          }
        } else {                                        // glass
          if (m.transmission !== undefined && m.transmission > 0){
            m.transmission = 0.26;
            m.thickness = Math.max(m.thickness || 0, 0.7);
            m.roughness = Math.max(m.roughness ?? 0.3, 0.5);
            m.ior = m.ior || 1.4;
            m.attenuationDistance = m.attenuationDistance || 1.4;
            if (m.color && m.color.getHex() >= 0xededed) m.color.setHex(0xc9d3dc);
          }
          m.envMapIntensity = 0.55;
        }
        m.needsUpdate = true;
        return m;
      });
      o.material = mats.length === 1 ? mats[0] : mats;
    });
  }

  const COUNT = matchMedia("(max-width:600px)").matches ? 2 : 4;
  let bounds = { x: 8, y: 5 };
  function resize(){
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const vH = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * camera.position.z;
    bounds = { x: (vH * camera.aspect) / 2 + 1.6, y: vH / 2 + 1.6 };
  }
  window.addEventListener("resize", resize, { passive:true });

  const bears = [];
  const clock = new THREE.Clock();
  let raf = 0, ready = false;

  // カーソル（NDC）。近づくとくまが逃げる
  const ptr = { x: 5, y: 5, active: false };
  if (matchMedia("(pointer:fine)").matches){
    window.addEventListener("pointermove", (e) => {
      ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
      ptr.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ptr.active = true;
    }, { passive: true });
    document.addEventListener("pointerleave", () => { ptr.active = false; });
    window.addEventListener("blur", () => { ptr.active = false; });
  }
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const _v = new THREE.Vector3();

  new GLTFLoader().load("models/bear.glb", (gltf) => {
    const src = gltf.scene;
    const box = new THREE.Box3().setFromObject(src);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    src.position.sub(center);
    const norm = 1.35 / Math.max(size.x, size.y, size.z || 1);   // 小さめ

    for (let i = 0; i < COUNT; i++){
      const style = "metal";                            // 全部メタリック
      const plush = false;
      const g = new THREE.Group();
      const b = src.clone(true);
      styleBear(b, style);
      g.add(b);
      const sizeMul = style === "plush" ? 1.22 : (style === "metal" ? 0.92 : 1);
      g.scale.setScalar(norm * (0.62 + Math.random() * 0.55) * sizeMul);
      // 左右どちらかの端に寄せて配置（交互にして左右バランス）
      const side = (i % 2 === 0) ? -1 : 1;
      g.position.set(
        side * bounds.x * (0.72 + Math.random() * 0.18),
        (Math.random() * 2 - 1) * bounds.y * 0.8,
        -2 + Math.random() * 4
      );
      g.rotation.y = Math.random() * Math.PI * 2;
      const vx0 = (Math.random() * 2 - 1) * 0.06;                 // 横移動はごく僅か
      const vy0 = (Math.random() * 2 - 1) * (plush ? 0.11 : 0.15);
      g.userData = {
        side,
        vx: vx0, vy: vy0, vx0, vy0,
        spin: (Math.random() * 2 - 1) * (plush ? 0.28 : 0.45),
        bobAmp: (plush ? 0.1 : 0.12) + Math.random() * 0.14,
        bobSpeed: (plush ? 0.4 : 0.55) + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        baseY: 0
      };
      g.userData.baseY = g.position.y;
      scene.add(g);
      bears.push(g);
    }
    resize();
    ready = true;
    loop();
  }, undefined, () => {});

  function loop(){
    raf = requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    for (const g of bears){
      const u = g.userData;

      // カーソル回避
      if (ptr.active){
        _v.copy(g.position).project(camera);          // NDC
        const dx = _v.x - ptr.x, dy = _v.y - ptr.y;
        const d = Math.hypot(dx, dy);
        const R = 0.32;
        if (d < R){
          const f = (R - d) / R;                       // 0..1
          const nx = d > 1e-4 ? dx / d : 1;
          const ny = d > 1e-4 ? dy / d : 0;
          g.position.x += nx * f * bounds.x * 2.6 * dt;
          u.baseY     += ny * f * bounds.y * 2.6 * dt;
          u.vx += nx * f * 1.1 * dt;
          u.vy += ny * f * 0.7 * dt;
        }
      }
      // 中央に来ないよう、ホームサイド（左右の端）へ寄せ続ける
      const keepX = bounds.x * 0.52;                   // これより内側なら押し戻す
      if (u.side < 0 && g.position.x > -keepX) u.vx -= (g.position.x + keepX) * 0.9 * dt;
      if (u.side > 0 && g.position.x <  keepX) u.vx += (keepX - g.position.x) * 0.9 * dt;

      // 速度は徐々に基準へ（逃げたあと落ち着く）
      u.vx += (u.vx0 - u.vx) * 0.5 * dt;
      u.vy += (u.vy0 - u.vy) * 0.5 * dt;
      u.vx = clamp(u.vx, -2.6, 2.6);
      u.vy = clamp(u.vy, -1.6, 1.6);

      g.position.x += u.vx * dt;
      u.baseY += u.vy * dt;
      // 端に出たら同じサイドの外側から戻す（反対側へワープしない）
      if (g.position.x >  bounds.x + 0.5) g.position.x = u.side > 0 ?  bounds.x : -keepX;
      if (g.position.x < -bounds.x - 0.5) g.position.x = u.side < 0 ? -bounds.x :  keepX;
      if (u.baseY >  bounds.y) u.baseY = -bounds.y;
      if (u.baseY < -bounds.y) u.baseY =  bounds.y;
      g.position.y = u.baseY + Math.sin(t * u.bobSpeed + u.phase) * u.bobAmp;
      g.rotation.y += u.spin * dt;
      g.rotation.z = Math.sin(t * u.bobSpeed * 0.5 + u.phase) * 0.12;
    }
    renderer.render(scene, camera);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ cancelAnimationFrame(raf); raf = 0; }
    else if (ready && !raf){ clock.getDelta(); loop(); }
  });
  resize();
}
</script>
